services:
  postgres:
    image: postgres:16
    container_name: toroerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toroerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toroerp}
      POSTGRES_DB: ${POSTGRES_DB:-toroerp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - toroerp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-toroerp}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  toroerp_postgres_data:
