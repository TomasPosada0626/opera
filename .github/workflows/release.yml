name: Release

# Tagear con `git tag vX.Y.Z && git push origin vX.Y.Z` dispara este workflow.
# El tag debe apuntar a un commit de main que ya pasó CI -- este workflow no
# vuelve a correr lint/tests, solo empaqueta y publica.
on:
  push:
    tags:
      - 'v*.*.*'

# El GITHUB_TOKEN automático de Actions (sin ningún secret que crear) alcanza
# para crear el Release y subir el instalador en este mismo repo con este
# permiso -- electron-builder lo toma vía GH_TOKEN más abajo.
permissions:
  contents: write

jobs:
  release-windows:
    # Mismo motivo que package-windows en ci.yml: NSIS necesita Wine en Linux
    # y windows-latest lo construye nativo.
    runs-on: windows-latest
    # 20 -> 35: mismo motivo que package-windows en ci.yml -- el instalador
    # de Docker Desktop embebido (~624 MB) sin caché podía por sí solo
    # acercarse al viejo límite en una corrida con conexión lenta del
    # runner (auditoría 2026-09-01, ronda 2).
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mismo cache que package-windows en ci.yml -- ver ese archivo para el
      # razonamiento completo de por qué la clave es el hash real (no un mes)
      # y por qué cachear no relaja la verificación de SHA256 que ya hace
      # fetch-docker-installer.js en cada corrida.
      - name: Compute Docker Desktop installer checksum
        id: docker-checksum
        shell: bash
        run: |
          curl -sL --retry 3 https://desktop.docker.com/win/main/amd64/checksums.txt -o checksums.txt
          hash=$(grep -i 'docker desktop installer\.exe$' checksums.txt | tail -1 | awk '{print $1}' | tr 'A-F' 'a-f')
          if [ -z "$hash" ]; then
            echo "No se encontró el hash de Docker Desktop Installer.exe en checksums.txt" >&2
            exit 1
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache Docker Desktop installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/desktop/resources/docker
          key: docker-desktop-installer-${{ steps.docker-checksum.outputs.hash }}
          restore-keys: |
            docker-desktop-installer-

      # electron-builder nombra el instalador con la versión de package.json,
      # no con el tag de git -- sin este paso, publicar v1.2.0 empaquetaría
      # igual "Opera-Windows-0.0.1-Setup.exe" si nadie bumpeó el package.json
      # a mano antes de tagear.
      - name: Sync package.json version with the tag
        working-directory: packages/desktop
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # CSC_LINK/CSC_KEY_PASSWORD son opcionales de este lado: si todavía no
      # hay certificado de firma de código configurado como secret,
      # electron-builder publica igual un instalador sin firmar (SmartScreen
      # lo marca "Editor desconocido", pero funciona) -- no hace falta
      # resolver la firma antes de tener el pipeline andando.
      - name: Build, sign and publish the Windows installer
        working-directory: packages/desktop
        run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
