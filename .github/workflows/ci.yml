name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default mínimo (solo lectura del repo) para el GITHUB_TOKEN de ambos jobs —
# ninguno de los dos necesita escribir nada (no publican releases, no
# comentan PRs, no empujan tags). Sin esto, el permiso efectivo depende de
# un ajuste de organización que puede cambiar sin que este archivo lo refleje.
permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    # ~4 min en la corrida típica (ver runs reales) — el margen es para un
    # colgado genuino (ej. Playwright esperando un puerto que nunca
    # responde), no para variación normal.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opera
          POSTGRES_PASSWORD: opera
          POSTGRES_DB: opera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Solo para este job — nada que ver con el .env local (gitignorado),
      # que no existe en el runner de CI. JWT_SECRET no es un secreto real:
      # solo firma tokens que viven y mueren dentro de esta corrida de CI.
      # connection_limit explícito: los e2e de concurrencia disparan hasta 8
      # llamadas genuinamente paralelas contra Serializable — un pool
      # implícito demasiado chico en un runner de pocos vCPUs fue la causa
      # raíz real de la falla intermitente que este mismo endurecimiento
      # de sesión corrigió (ver commit del guard atómico en
      # markWarehoused/complete).
      DATABASE_URL: postgresql://opera:opera@localhost:5432/opera?schema=public&connection_limit=10&pool_timeout=20
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 1d
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      # #29 (auditoría): --audit-level=high de arriba cubre todo el árbol
      # (incluidas devDependencies) para no bloquear CI por ruido de
      # herramientas de build/test que nunca corren en producción real. Este
      # segundo audit acota a moderate PERO solo sobre dependencias de
      # producción (--prod) -- un CVE moderate en algo que sí corre en el
      # backend/desktop empaquetado bloquea igual, sin reabrir el ruido que
      # el primer audit evita a propósito.
      - name: Audit production dependencies (moderate+)
        run: pnpm audit --audit-level=moderate --prod

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test (unit, with coverage gate)
        run: pnpm --filter backend test:cov

      - name: Apply database migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - name: E2E tests
        run: pnpm --filter backend test:e2e

      - name: Build backend
        run: pnpm --filter backend build

      - name: Typecheck desktop
        run: pnpm --filter desktop exec tsc

      - name: Test desktop (unit, with coverage gate)
        run: pnpm --filter desktop test:cov

      - name: Build desktop (renderer + electron)
        run: pnpm --filter desktop exec tsc && pnpm --filter desktop exec vite build

      # Los 5 specs de Playwright (e2e/*.spec.ts) existían pero no corrían
      # en CI — podían pudrirse sin que nadie se entere, a diferencia del
      # e2e de Jest del backend, que sí está gateado (y que ya demostró su
      # valor real atrapando un bug de concurrencia genuino). Corren contra
      # Chromium real (no Electron, ver playwright.config.ts) + el backend
      # real de este mismo job, ya construido, contra el mismo Postgres del
      # service container.
      # El binario de Chromium (no los deps de sistema de --with-deps, esos
      # los vuelve a instalar apt cada vez igual) es lo pesado de esta
      # descarga — cachearlo por versión de Playwright ahorra ese tiempo en
      # cada corrida en la que el lockfile no cambió esa versión.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter desktop exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # --with-deps también instala las dependencias de sistema de Chromium
      # (libnss3, etc.) — esas SÍ hay que reinstalarlas aunque el binario ya
      # esté en caché, porque no viven en ~/.cache/ms-playwright sino en el
      # sistema del runner (que siempre arranca limpio).
      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter desktop exec playwright install-deps chromium

      - name: Start backend server for Playwright (background)
        # AUTH_LOGIN_RATE_LIMIT (ver .env.example y auth.controller.ts):
        # los 5 specs de Playwright hacen login real de verdad contra este
        # mismo backend en la misma corrida -- el total agregado supera el
        # límite de producción (5/min) sin que ninguno individualmente
        # abuse del endpoint. No afecta el límite real de producción, que
        # sigue en 5 salvo que se fije esta variable explícitamente.
        run: |
          AUTH_LOGIN_RATE_LIMIT=30 nohup node packages/backend/dist/src/main.js > backend-server.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 1
          done
          echo "El backend no quedó listo a tiempo"
          cat backend-server.log
          exit 1

      - name: E2E tests (desktop, Playwright contra el backend real)
        # vite-plugin-electron (vite.config.mts) lanzaba Electron de verdad
        # al arrancar el dev server que Playwright usa como webServer -- en
        # un runner Linux sin display eso crasheaba con "ui/aura/env.cc: The
        # platform failed to initialize" y tumbaba el suite entero antes de
        # arrancar (encontrado corriendo esto por primera vez en CI real).
        # playwright.config.ts ya fija NODE_ENV=test para el webServer, y
        # vite.config.mts deja de registrar el plugin de Electron con ese
        # NODE_ENV -- no hay nada que arrancar acá, ni falta ninguna env var
        # especial en este step.
        run: pnpm --filter desktop test:e2e

      # playwright.config.ts ya genera trace 'retain-on-failure' en
      # test-results/ -- antes se perdía junto con el runner al terminar el
      # job, así que un fallo solo-en-CI no tenía nada que descargar para
      # depurar más que el log de la consola. backend-server.log también:
      # es lo único que explica un fallo del lado del backend real que
      # Playwright usó.
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            packages/desktop/test-results/
            backend-server.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop backend server
        if: always()
        run: kill "$(cat backend.pid)" || true

  package-windows:
    # El instalador NSIS de Windows no se puede cross-compilar de forma
    # confiable desde ubuntu-latest: electron-builder necesita Wine para
    # correr signtool.exe/el compilador de NSIS, y el runner de Linux no lo
    # trae instalado ("wine process failed ENOENT"). windows-latest lo
    # construye nativo, sin Wine de por medio — más simple y representa de
    # verdad lo que se empaqueta.
    runs-on: windows-latest
    needs: lint-test-build
    # 20 -> 35: el instalador de Docker Desktop embebido (~624 MB, ver
    # fetch-docker-installer.js) sin caché podía por sí solo acercarse al
    # viejo límite de 20 min en una corrida con conexión lenta del runner
    # (auditoría 2026-09-01, ronda 2) -- el cache de abajo hace que la
    # mayoría de las corridas ni se acerquen, pero el margen sigue siendo
    # para un colgado genuino, no para la variación normal de una descarga
    # de esa magnitud en la primera corrida de cada mes.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El instalador de Docker Desktop es ~624 MB y casi nunca cambia --
      # fetch-docker-installer.js ya verifica su SHA256 contra el checksum
      # que Docker publica en cada corrida (cache o no), así que cachear no
      # relaja esa verificación, solo evita re-descargar cuando no hace
      # falta. La clave del cache es ese mismo hash (no un mes, ver auditoría
      # 2026-09-03 ronda 3): una clave por mes quedaba pegada al instalador
      # viejo el resto del mes si Docker publicaba una versión nueva a mitad
      # de camino (GitHub Actions Cache es inmutable por clave exacta, así
      # que nunca se volvía a guardar) -- con el hash real como clave, el
      # cache cambia exactamente cuando cambia la versión real, sin depender
      # del calendario. Un fallo de red acá (curl) no compromete nada: en el
      # peor caso el paso de abajo falla el `if`, cae a `restore-keys` y
      # fetch-docker-installer.js verifica igual antes de aceptar el archivo.
      - name: Compute Docker Desktop installer checksum
        id: docker-checksum
        shell: bash
        run: |
          curl -sL --retry 3 https://desktop.docker.com/win/main/amd64/checksums.txt -o checksums.txt
          hash=$(grep -i 'docker desktop installer\.exe$' checksums.txt | tail -1 | awk '{print $1}' | tr 'A-F' 'a-f')
          if [ -z "$hash" ]; then
            echo "No se encontró el hash de Docker Desktop Installer.exe en checksums.txt" >&2
            exit 1
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache Docker Desktop installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/desktop/resources/docker
          key: docker-desktop-installer-${{ steps.docker-checksum.outputs.hash }}
          restore-keys: |
            docker-desktop-installer-

      # Evaluado (auditoría 2026-09-01, ronda 2): no saltear el embebido de
      # Docker acá para "ahorrar" en cada PR -- este job es la única red de
      # seguridad que compila installer.nsh en CI, y el bug real de esta
      # misma sesión (orden reinicio/Docker) vivía justo en ese script. Con
      # el cache de arriba, el costo real ya baja casi siempre a "restaurar
      # ~600 MB", no a "descargarlos".
      - name: Package Windows installer
        run: pnpm --filter desktop build
