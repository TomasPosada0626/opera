name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opera
          POSTGRES_PASSWORD: opera
          POSTGRES_DB: opera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Solo para el servicio de Postgres de este job — nada que ver con el
      # .env local (gitignorado), que no existe en el runner de CI.
      DATABASE_URL: postgresql://opera:opera@localhost:5432/opera?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Apply database migrations
        run: pnpm --filter backend exec prisma migrate deploy

      - name: E2E tests
        run: pnpm --filter backend test:e2e

      - name: Build backend
        run: pnpm --filter backend build

      - name: Typecheck desktop
        run: pnpm --filter desktop exec tsc

      - name: Build desktop renderer + electron
        run: pnpm --filter desktop exec vite build
